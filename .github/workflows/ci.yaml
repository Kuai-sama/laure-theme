name: CI, Release & Marketplace Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Validation PR et Push
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate JSON syntax
        run: bun run lint

      - name: Dry-run packaging VSIX
        run: bun run package

      - name: Verify README.md inclusion in VSIX
        run: |
          if unzip -l *.vsix | grep -iq "extension/readme.md"; then
            echo "✓ README.md is present in the VSIX package"
          else
            echo "✗ ERROR: README.md was excluded by .vscodeignore!"
            exit 1
          fi

      - name: Upload VSIX Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: "*.vsix"

  # 2. Release GitHub & Publication Marketplace
  release-and-publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        run: bunx @vscode/vsce publish --packagePath *.vsix -p ${{ secrets.VSCE_PAT }}