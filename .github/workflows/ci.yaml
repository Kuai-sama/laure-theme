name: CI & GitHub Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. PR / Push validation (CI)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate JSON syntax
        run: bun run lint

      - name: Dry-run packaging VSIX
        run: bun run package

      - name: Verify README.md inclusion in VSIX
        run: |
          if unzip -l *.vsix | grep -iq "extension/readme.md"; then
            echo "✓ README.md is present in the VSIX package"
          else
            echo "✗ ERROR: README.md was excluded by .vscodeignore!"
            exit 1
          fi

      - name: Cleanup VSIX artifact
        if: always()
        run: rm -f *.vsix

  # 2. Automated GitHub Release on Tag (CD)
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a GitHub Release and attach assets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Package VSIX
        run: bun run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true